name: Deploy 11ty to GitHub Pages

on:
  push:
    branches:
      - main # 현재 작업 중인 브랜치명에 맞게 수정하세요 (예: master)

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 사용 중인 노드 버전에 맞게 조정

      - name: Install dependencies
        run: npm install

      - name: Build 11ty
        run: npx @11ty/eleventy # 11ty 빌드 명령어

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site' # 핵심 부분: 11ty의 빌드 결과물이 담기는 폴더를 지정합니다.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4